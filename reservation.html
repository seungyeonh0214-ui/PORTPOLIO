<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="한승연 포트폴리오 — 방문 예약" />
  <title>방문 예약 — 한승연 Portfolio</title>
  <style>
    :root {
      --ink: #111111;
      --paper: #f5f4f0;
      --signal: #ff3d20;
      --line: rgba(17, 17, 17, .22);
      --pad: clamp(1.25rem, 4vw, 4.5rem);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.55;
      word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }

    .nav {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem var(--pad);
      border-bottom: 1px solid var(--line);
      background: rgba(245, 244, 240, .88);
      backdrop-filter: blur(12px);
    }
    .brand { font-size: .78rem; font-weight: 800; letter-spacing: .09em; }
    .nav-links { display: flex; gap: clamp(1rem, 3vw, 2.6rem); font-size: .76rem; font-weight: 700; }
    .nav a { position: relative; }
    .nav a::after {
      content: "";
      position: absolute;
      left: 0; right: 100%; bottom: -.25rem;
      height: 1px; background: var(--ink);
      transition: right .25s ease;
    }
    .nav a:hover::after, .nav a:focus-visible::after { right: 0; }

    main { flex: 1; padding: 8rem var(--pad) clamp(4rem, 8vw, 7rem); }
    .eyebrow { margin: 0 0 1.2rem; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 7vw, 6.4rem); line-height: 1; letter-spacing: -.055em; font-weight: 650; }
    h1 .accent { color: var(--signal); }
    .back { display: inline-block; margin-top: 2.5rem; padding-bottom: .15rem; border-bottom: 1px solid var(--ink); font-size: .9rem; font-weight: 700; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* 예약 내용이 들어갈 자리 */
    #reservation-content { margin-top: clamp(2.5rem, 6vw, 5rem); }

    .foot { display: flex; justify-content: space-between; gap: 2rem; padding: 1.4rem var(--pad); border-top: 1px solid var(--line); font-size: .72rem; font-weight: 700; }

    @media (max-width: 560px) {
      main { padding-top: 6.5rem; }
      .nav-links a.opt { display: none; }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="주요 메뉴">
    <a class="brand" href="index.html">HAN SEUNGYEON / PORTFOLIO</a>
    <div class="nav-links">
      <a class="opt" href="index.html#profile">PROFILE</a>
      <a class="opt" href="index.html#work">WORK</a>
      <a class="opt" href="index.html#skills">SKILLS</a>
      <a href="index.html#contact">CONTACT</a>
      <a href="location.html">VISIT</a>
    </div>
  </nav>

  <main id="main">
    <p class="eyebrow">Visit / Reservation</p>
    <h1>방문 예약<span class="accent">.</span></h1>

    <!-- TODO: 예약 관련 내용은 이후 단계에서 구성 -->
    <section id="reservation-content" aria-label="예약"></section>

    <a class="back" href="location.html">← 찾아오는 길로 돌아가기</a>
  </main>

  <footer class="foot"><span>HAN SEUNGYEON / PORTFOLIO</span><span>© 2026</span></footer>
</body>
</html>
